<script>
// Offline-Vorbereitung: Die beiden Bibliotheken werden bei bestehender Verbindung einmal
// geladen, damit der Service Worker sie anschließend für den Offlinebetrieb cachen kann.
(function(){
  const libs=[
    
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ];
  if(navigator.onLine && 'serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      setTimeout(()=>{
        libs.forEach(u=>fetch(u,{cache:'reload'}).catch(()=>{}));
      },500);
    });
  }
})();

<script>
(function(){

  const STORE_KEY = 'atemschutz:einsatz';

  const LICENSE_KEY = 'asue:lizenz';
  const LICENSE_SERVER = 'https://license.rabenhorstacht.de/api';

  function getLicense(){
    try { return JSON.parse(localStorage.getItem(LICENSE_KEY) || 'null'); }
    catch(e){ return null; }
  }

  function saveLicense(data){
    localStorage.setItem(LICENSE_KEY, JSON.stringify(data));
  }

  // ---- Lizenzregeln v1.1.3 ----
// Grundsatz: Die Lizenzprüfung unterbricht nie einen laufenden Einsatz.
const LICENSE_GRACE_DAYS = 14;               // Offline-Karenz seit letzter erfolgreicher Prüfung
const LICENSE_RECHECK_MS = 6*3600*1000;      // Hintergrundprüfung
const LICENSE_RECHECK_SETUP_MS = 10*60*1000; // auf dem Startbildschirm (neuer Einsatz / Beitreten)
let licenseCheckAt = 0;
let licenseChecking = false;

// Status aus den lokal gespeicherten Daten (synchron, ohne Netzwerk):
// 'none' | 'ok' | 'invalid' | 'grace-expired'
function licenseStatus(){
  const lic=getLicense();
  if(!lic) return 'none';
  if(lic.gesperrt) return 'invalid';
  if(!lic.letztePruefung){ lic.letztePruefung=Date.now(); saveLicense(lic); } // Bestandsgeräte: Karenz startet jetzt
  const days=(Date.now()-lic.letztePruefung)/86400000;
  if(days>LICENSE_GRACE_DAYS) return 'grace-expired';
  return 'ok';
}
function licenseBlocksNewEinsatz(){
  const st=licenseStatus();
  return st==='invalid' || st==='grace-expired';
}

// Fragt den Server. Nur eine eindeutige Antwort (ok:true / ok:false) ändert etwas.
// Serverfehler (5xx), Timeout, kein JSON oder unerwartete Antwort zählen wie offline.
async function checkLicense(){
  const lic=getLicense();
  if(!lic) return 'none';
  let d=null, http=0;
  try{
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(),8000);
    try{
      const r=await fetch(LICENSE_SERVER+'/validieren',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({geraete_id:lic.geraete_id}),
        signal:ctrl.signal
      });
      http=r.status;
      d=await r.json();
    }finally{ clearTimeout(to); }
  }catch(e){ return licenseStatus(); }
  if(http>=500 || !d || typeof d.ok!=='boolean') return licenseStatus();
  const cur=getLicense()||lic;
  if(d.ok===true){
    cur.letztePruefung=Date.now(); cur.gesperrt=false; delete cur.sperrGrund;
    // Verlängerung übernehmen: Laufzeit/Feuerwehr aus der Serverantwort, falls mitgeliefert
    const src=(d.lizenz&&typeof d.lizenz==='object') ? d.lizenz : ((d.license&&typeof d.license==='object') ? d.license : d);
    if(typeof src.gueltig_bis==='string' && src.gueltig_bis) cur.gueltig_bis=src.gueltig_bis;
    if(typeof src.feuerwehr==='string' && src.feuerwehr) cur.feuerwehr=src.feuerwehr;
    if(typeof src.geraete_name==='string' && src.geraete_name) cur.geraete_name=src.geraete_name;
  }
  else { cur.gesperrt=true; cur.sperrGrund=d.error||''; }
  saveLicense(cur);
  return licenseStatus();
}

// Nicht blockierend und gedrosselt: beim Start, auf dem Startbildschirm, sonst alle paar Stunden.
function maybeCheckLicense(isSetup){
  if(licenseChecking || !getLicense()) return;
  const limit=isSetup ? LICENSE_RECHECK_SETUP_MS : LICENSE_RECHECK_MS;
  if(Date.now()-licenseCheckAt<limit) return;
  licenseChecking=true; licenseCheckAt=Date.now();
  const before=licenseStatus();
  checkLicense().then(after=>{
    licenseChecking=false;
    updateLicenseBanner();
    refreshLicenseFooter();
    if(!state && after!==before) render(); // nur ohne laufenden Einsatz neu zeichnen
  }).catch(()=>{ licenseChecking=false; });
}

// Warnbanner, unabhängig vom Dashboard-Rendering (liegt direkt im body, blockiert keine Eingaben)
function updateLicenseBanner(){
  let el=document.getElementById('asue-lic-banner');
  const st=licenseStatus();
  if(licenseShownSt!==st){ licenseShownSt=st; refreshLicenseFooter(); }
  if(st==='ok' || st==='none'){ if(el) el.remove(); return; }
  if(!el){
    el=document.createElement('div');
    el.id='asue-lic-banner';
    el.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:40;background:var(--amber);color:#1a1500;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = st==='invalid'
    ? '⚠️ Lizenz ungültig oder abgelaufen – ein laufender Einsatz ist nicht betroffen, neue Einsätze sind gesperrt.'
    : '⚠️ Lizenz seit über '+LICENSE_GRACE_DAYS+' Tagen nicht geprüft – bitte online gehen. Neue Einsätze sind gesperrt.';
}

// Startbildschirm: neuer Einsatz gesperrt, Beitreten bleibt möglich
function applyLicenseGate(){
  if(!licenseBlocksNewEinsatz()) return;
  const b=document.getElementById('btn-start-einsatz');
  if(b) b.disabled=true;
  const m=document.getElementById('setup-msg');
  if(m){
    m.style.color='var(--amber)';
    m.textContent='Lizenz ungültig bzw. nicht geprüft: Neuer Einsatz gesperrt. Beitreten zu bestehenden Einsätzen ist weiter möglich.';
  }
}

function licenseStatusText(lic){
  const st=licenseStatus();
  const last=lic.letztePruefung ? new Date(lic.letztePruefung).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}) : '-';
  if(st==='invalid') return '🔴 Ungültig / abgelaufen<br>Zuletzt geprüft: '+last;
  if(st==='grace-expired') return '🟠 Offline-Karenz abgelaufen<br>Zuletzt geprüft: '+last;
  const until=new Date((lic.letztePruefung||Date.now())+LICENSE_GRACE_DAYS*86400000).toLocaleDateString('de-DE');
  const frisch=(Date.now()-(lic.letztePruefung||0)) < LICENSE_RECHECK_MS*1.5;
  return '🟢 Aktiv<br>Zuletzt geprüft: '+last+(frisch ? '' : '<br>Offline-Karenz bis: '+until);
}
window.asueLicenseStatusText = licenseStatusText;
window.asueLicenseActions = {
  // Sofort beim Server prüfen (z. B. nach einer Verlängerung); jederzeit gefahrlos
  check: async function(){
    licenseCheckAt = 0;
    const st = await checkLicense();
    updateLicenseBanner(); refreshLicenseFooter();
    return st;
  },
  // Lizenz auf diesem Gerät entfernen und neu eingeben; nie während eines laufenden Einsatzes
  change: function(){
    if(state){ alert('Während eines laufenden Einsatzes kann die Lizenz nicht gewechselt werden. Bitte zuerst den Einsatz beenden oder verlassen.'); return; }
    if(!confirm('Lizenz auf diesem Gerät entfernen und eine andere Lizenz eingeben?')) return;
    try{ localStorage.removeItem('asue:lizenz'); }catch(e){}
    render();
  }
};
let licenseShownSt = '';
function refreshLicenseFooter(){ try{ if(window.renderV111License) window.renderV111License(); }catch(e){} }
// ---- Ende Lizenzregeln ----


  
function renderAsueLicenseBox(){
  const lic = JSON.parse(localStorage.getItem('asue:lizenz') || 'null');
  if(!lic) return '';
  return `<div class="panel" style="margin-top:16px;padding:12px">
    🔐 Lizenz<br>
    Feuerwehr: ${esc(lic.feuerwehr || '-')}<br>
    Lizenz: <b>${esc(lic.code || lic.lizenz_code || '-')}</b><br>
    Status: ${licenseStatusText(lic)}<br>
    Gültig bis: ${esc(lic.gueltig_bis || '-')}<br>
    Gerät: ${esc(lic.geraete_name || '-')}
  </div>`;
}

function renderLicenseSetup(){
    app.innerHTML=`
    <div class="setup-card">
      <h2>Lizenz aktivieren</h2>
      <div class="field"><label>Lizenzcode</label><input id="lic-code" placeholder="ASUE-XXXX-XXXX"></div>
      <div class="field"><label>Gerätename</label><input id="lic-name" placeholder="Tablet ELW"></div>
      <button class="btn primary" id="lic-btn" style="width:100%">Aktivieren</button>
      <div id="lic-msg" style="margin-top:12px"></div>
    </div>`;
    document.getElementById('lic-btn').onclick=async()=>{
      const msg=document.getElementById('lic-msg');
      try{
        const r=await fetch(LICENSE_SERVER+'/aktivieren',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            code:document.getElementById('lic-code').value,
            geraete_name:document.getElementById('lic-name').value
          })
        });
        const d=await r.json();
        if(d.ok){
          const eingegebenerName=((document.getElementById('lic-name')||{}).value||'').trim();
          saveLicense(Object.assign({},d,{
            geraete_name: d.geraete_name || d.device_name || eingegebenerName,
            letztePruefung:Date.now(), gesperrt:false
          }));
          render();
        }else msg.textContent=d.error||'Fehler';
      }catch(e){msg.textContent='Lizenzserver nicht erreichbar';}
    };
  }


  const HISTORY_KEY = 'atemschutz:einsaetze';
  const PDF_HISTORY_KEY = 'atemschutz:pdf:';
  const ROLE_KEY = 'atemschutz:rolle';
  const DRUCK_INTERVAL_MIN = 10; // Erinnerung alle 10 Minuten
  const EDIT_ROLE_PIN = '0000'; // Schutz beim Wechsel aus reinen Lesemodus-Rollen

  // Supabase / Mehrgeräte-Synchronisierung
  const SUPABASE_URL = 'https://erhrmgilyevfnsbviiir.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ZHw_OzSRWUha5iEk-ZtRzw_cxicrJ1j';
  let sb = null;
  let currentSession = null;
  let cloudChannel = null;
  let applyingCloudState = false;
  let authReady = false;

  const ROLE_LABELS = {
    ueberwachung:'Atemschutzüberwachung',
    fuehrung:'Gruppenführer / Führung',
    einsatzleiter:'Einsatzleiter',
    beobachter:'Beobachter',
    admin:'Administrator'
  };
  function getRole(){ return localStorage.getItem(ROLE_KEY) || ''; }
  function setRole(role){ localStorage.setItem(ROLE_KEY, role); }
  function roleLabel(role=getRole()){ return ROLE_LABELS[role] || 'Benutzer'; }
  function actionRoleLabel(role=getRole()){
    if(role==='fuehrung') return 'Gruppenführer';
    if(role==='ueberwachung') return 'Atemschutzüberwachung';
    if(role==='admin') return 'Administrator';
    if(role==='einsatzleiter') return 'Einsatzleiter';
    if(role==='beobachter') return 'Beobachter';
    return roleLabel(role);
  }

  async function touchParticipant(){
    const client=cloudClient();
    if(!client || !currentSession || !state?.einsatz?.cloudId || !navigator.onLine) return;
    const {error}=await client.from('einsatz_teilnehmer')
      .update({zuletzt_aktiv:new Date().toISOString()})
      .eq('einsatz_id',state.einsatz.cloudId)
      .eq('user_id',currentSession.user.id);
    if(error) console.warn('Teilnehmer-Heartbeat fehlgeschlagen:',error);
  }

  async function checkOtherCaretakers(){
    const client=cloudClient();
    if(!client || !currentSession || !state?.einsatz?.cloudId) return {known:false,count:0,participants:[]};
    if(!navigator.onLine) return {known:false,count:0,participants:[]};
    const cutoff=new Date(Date.now()-120000).toISOString();
    const {data,error}=await client.from('einsatz_teilnehmer')
      .select('user_id,rolle,zuletzt_aktiv')
      .eq('einsatz_id',state.einsatz.cloudId)
      .in('rolle',['ueberwachung','fuehrung'])
      .neq('user_id',currentSession.user.id)
      .gte('zuletzt_aktiv',cutoff);
    if(error){
      console.warn('Betreuungsprüfung fehlgeschlagen:',error);
      return {known:false,count:0,participants:[]};
    }
    return {known:true,count:(data||[]).length,participants:data||[]};
  }

  async function leaveEinsatz(){
    if(!state) return;
    let check={known:false,count:0,participants:[]};
    if(state.einsatz?.cloudId){
      check=await checkOtherCaretakers();
      if(!check.known && navigator.onLine){
        alert('Einsatz verlassen nicht möglich. Die Betreuung durch ein anderes Gerät konnte gerade nicht sicher geprüft werden.');
        return;
      }
      if(check.known && check.count===0){
        alert('Einsatz verlassen nicht möglich. Auf diesem Einsatz ist aktuell kein anderes Gerät als Atemschutzüberwachung oder Gruppenführer aktiv betreuend erkannt. Bitte übergib die Betreuung zuerst an ein anderes Gerät.');
        return;
      }
    }
    try{
      const client=cloudClient();
      if(client && currentSession && state.einsatz?.cloudId && navigator.onLine){
        const {error}=await client.from('einsatz_teilnehmer')
          .update({zuletzt_aktiv:new Date(0).toISOString()})
          .eq('einsatz_id',state.einsatz.cloudId)
          .eq('user_id',currentSession.user.id);
        if(error) console.warn('Teilnehmer konnte nicht abgemeldet werden:',error);
        if(cloudChannel){ try{ await client.removeChannel(cloudChannel); }catch(e){} cloudChannel=null; }
      }
    }catch(e){ console.warn('Einsatz verlassen – Cloud-Abmeldung fehlgeschlagen:',e); }
    state=null;
    await saveState(null);
    render();
  }

  function makeEinsatzCode(){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out='';
    for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];

  // Fingerabdruck (SHA-256) des Lizenzcodes: hängt Einsätze an die Feuerwehr, ohne den Code selbst abzulegen
  async function licenseHash(){
    try{
      const lic=getLicense();
      const code=String((lic&&(lic.code||lic.lizenz_code))||'').trim().toUpperCase();
      if(!code || !(window.crypto && crypto.subtle)) return null;
      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('asue-hist:'+code));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){ return null; }
  }

  async function cloudCreateEinsatz(s){
    const client=cloudClient();
    if(!client || !currentSession || !s?.einsatz) return null;
    const code=s.einsatz.code || makeEinsatzCode();
    s.einsatz.code=code;
    const lizenz_hash=await licenseHash();
    const row={
      einsatz_code:code,
      einsatzort:s.einsatz.ort || 'Ohne Angabe',
      datum:new Date((s.einsatz.datum||new Date().toISOString().slice(0,10))+'T00:00:00').toISOString(),
      einheitsfuehrer:s.einsatz.leiter || '',
      atemschutzueberwachung:s.einsatz.leiter || '',
      status:'aktiv',
      erstellt_von:currentSession.user.id,
      lizenz_hash,
      zustand:s
    };
    const {data,error}=await client.from('einsaetze').insert(row).select('id,einsatz_code').single();
    if(error) throw error;
    s.einsatz.cloudId=data.id;
    s.einsatz.code=data.einsatz_code;
    const {error:memberError}=await client.from('einsatz_teilnehmer').insert({einsatz_id:data.id,user_id:currentSession.user.id,rolle:(getRole()==='fuehrung'?'fuehrung':getRole()==='einsatzleiter'?'fuehrung':getRole()==='beobachter'?'beobachter':'ueberwachung')});

  }

  async function startRealtime(cloudId){
    const client=cloudClient();
    if(!client || !cloudId) return;
    if(cloudChannel){ try{ await client.removeChannel(cloudChannel); }catch(e){} }
    cloudChannel=client.channel('einsatz-'+cloudId)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'einsaetze',filter:'id=eq.'+cloudId},payload=>{
        if(applyingCloudState) return;

        // Einsatz wurde auf einem anderen Gerät beendet:
        // Alle verbundenen Geräte verlassen den gemeinsamen Einsatz
        // ebenfalls und legen den letzten Stand lokal ins Archiv.
        if(payload.new?.status === 'beendet'){
          const remote=payload.new?.zustand;
          if(remote){
            remote.einsatz=remote.einsatz||{};
            remote.einsatz.cloudId=cloudId;
            remote.einsatz.code=payload.new.einsatz_code || remote.einsatz.code;
            saveHistory(remote);
          }
          applyingCloudState=true;
          state=null;
          saveState(null).finally(async()=>{
            applyingCloudState=false;
            if(cloudChannel){ try{ await client.removeChannel(cloudChannel); }catch(e){} cloudChannel=null; }
            render();
            alert('Der Einsatz wurde auf einem anderen Gerät beendet.');
          });
          return;
        }

        const remote=payload.new?.zustand;
        if(!remote) return;
        applyingCloudState=true;
        try{
          remote.einsatz=remote.einsatz||{};
          remote.einsatz.cloudId=cloudId;
          remote.einsatz.code=payload.new.einsatz_code || remote.einsatz.code;
          state=remote;
          saveState(state).finally(()=>{ applyingCloudState=false; render(); });
        }catch(e){ applyingCloudState=false; console.warn(e); }
      })
      .subscribe(status=>console.log('Realtime:',status));
  }

  async function refreshCloudStateIfAvailable(){
    const client=cloudClient();
    if(!client || !currentSession || !state?.einsatz?.cloudId) return;
    const {data,error}=await client.from('einsaetze').select('id,einsatz_code,zustand,status').eq('id',state.einsatz.cloudId).single();
    if(error || !data) return;

    // Falls der Einsatz währenddessen auf einem anderen Gerät beendet wurde.
    if(data.status === 'beendet'){
      if(data.zustand){
        const remote=data.zustand;
        remote.einsatz=remote.einsatz||{};
        remote.einsatz.cloudId=data.id;
        remote.einsatz.code=data.einsatz_code || remote.einsatz.code;
        saveHistory(remote);
      }
      applyingCloudState=true;
      state=null;
      await saveState(null);
      applyingCloudState=false;
      if(cloudChannel){ try{ await client.removeChannel(cloudChannel); }catch(e){} cloudChannel=null; }
      return;
    }

    if(!data.zustand) return;
    applyingCloudState=true;
    state=data.zustand;
    state.einsatz.cloudId=data.id;
    state.einsatz.code=data.einsatz_code;
    await saveState(state);
    applyingCloudState=false;
    await startRealtime(data.id);
  }

  // Offline-first: IndexedDB ist der primäre Speicher. localStorage bleibt als
  // Fallback/Migrationsweg erhalten, damit bestehende Einsätze nicht verloren gehen.
  const DB_NAME = 'AtemschutzUeberwachungDB';
  const DB_VERSION = 1;
  const DB_STORE = 'daten';
  let dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!window.indexedDB){ reject(new Error('IndexedDB nicht verfügbar')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error || new Error('IndexedDB konnte nicht geöffnet werden'));
    });
    return dbPromise;
  }

  async function idbGet(key){
    const db = await openDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(DB_STORE,'readonly');
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = ()=>resolve(req.result ?? null);
      req.onerror = ()=>reject(req.error);
    });
  }

  async function idbSet(key,value){
    const db = await openDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put(value,key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }

  async function saveState(state){
    const json = JSON.stringify(state);
    try{ await idbSet(STORE_KEY, state); }catch(e){ console.warn('IndexedDB save failed', e); }
    try{ localStorage.setItem(STORE_KEY, json); }catch(e){ console.warn('local save failed', e); }
    try{ if(window.storage && window.storage.set) await window.storage.set(STORE_KEY, json, true); }catch(e){ console.warn('shared save failed', e); }
    if(!applyingCloudState){ try{ await cloudSaveState(state); }catch(e){ console.warn('cloud save failed', e); } }
  }

  async function loadLocalState(){
    try{
      const dbState = await idbGet(STORE_KEY);
      if(dbState !== null && dbState !== undefined) return dbState;
    }catch(e){ console.warn('IndexedDB load failed', e); }
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        try{ await idbSet(STORE_KEY, parsed); }catch(e){}
        return parsed;
      }
    }catch(e){ return null; }
    return null;
  }

  function saveHistory(einsatz){
    if(!einsatz) return;
    try{
      const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      const copy = JSON.parse(JSON.stringify(einsatz));
      copy.gespeichertAm = Date.now();
      const idx = history.findIndex(x=>x.einsatz && x.einsatz.id===copy.einsatz.id);
      if(idx >= 0) history[idx] = copy; else history.unshift(copy);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0,100)));
      // IndexedDB-Kopie im Hintergrund. Die UI muss darauf nicht warten.
      idbSet(HISTORY_KEY, history.slice(0,100)).catch(e=>console.warn('History IndexedDB save failed',e));
    }catch(e){ console.warn('history save failed', e); }
  }

  async function loadHistory(){
    try{
      const dbHistory = await idbGet(HISTORY_KEY);
      if(Array.isArray(dbHistory) && dbHistory.length) return dbHistory;
    }catch(e){ console.warn('History IndexedDB load failed', e); }
    try{
      const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      if(Array.isArray(history) && history.length){
        try{ await idbSet(HISTORY_KEY, history); }catch(e){}
      }
      return history;
    }catch(e){ return []; }
  }

  async function loadState(){

    if(local !== null && local !== undefined) return local;
    try{
      if(window.storage && window.storage.get){
        const res = await window.storage.get(STORE_KEY, true);
        return res ? JSON.parse(res.value) : null;
      }
    }catch(e){ console.warn('shared load failed:', e); }
    return null;
  }

  function beep(freq, dur){
    try{
      if(!window.__audioCtx) window.__audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const audioCtx = window.__audioCtx;
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'square';
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur/1000);
    }catch(e){}
  }

  function computeStatus(t){
    if(t.status === 'vorbereitet') return 'prep';
    if(t.status === 'beendet') return 'ended';
    const elapsedSec = (Date.now() - t.start) / 1000;
    const totalSec = t.erwarteteZeitMin * 60;
    if(elapsedSec >= (2/3)*totalSec) return 'warn2';
    if(elapsedSec >= (1/3)*totalSec) return 'warn1';
    return 'ok';
  }

  function renderLocalQr(container, data, size=300){
    container.innerHTML='';
    try{
      const qr = new LocalQRCode(-1, 2); // Fehlerkorrektur H
      qr.addData(String(data||''));
      qr.make();
      const count = qr.getModuleCount();
      const quiet = 4;
      const total = count + quiet*2;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      canvas.style.width = size+'px'; canvas.style.height = size+'px';
      canvas.setAttribute('aria-label','Einsatz QR-Code');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
      const cell = size / total;
      ctx.fillStyle='#000';
      for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){
          if(qr.isDark(r,c)){
            const x=Math.round((c+quiet)*cell);
            const y=Math.round((r+quiet)*cell);
            const x2=Math.round((c+quiet+1)*cell);
            const y2=Math.round((r+quiet+1)*cell);
            ctx.fillRect(x,y,x2-x,y2-y);
          }
        }
      }
      container.appendChild(canvas);
    }catch(err){
      console.error('Lokaler QR-Code konnte nicht erzeugt werden:',err);

  async function syncOfflineEinsatzIfPossible(){
    if(!state?.einsatz || state.einsatz.cloudId || !currentSession) return false;
    if(!navigator.onLine) return false;
    try{
      const created=await cloudCreateEinsatz(state);
      if(created){
        await saveState(state);
        if(state?.einsatz?.cloudId){ render(); return true; }
      }
    }catch(e){ console.warn('Offline-Einsatz konnte noch nicht synchronisiert werden:',e); }
    return false;
  }

  async function refreshCloudEinsatzOnReconnect(){
    if(!state?.einsatz?.cloudId || !currentSession || !navigator.onLine) return false;
    const client=cloudClient();
    if(!client) return false;
    try{
      // Beim Wiederverbinden immer den aktuellen Cloud-Stand holen.
      // Dadurch werden Änderungen, die während der Offline-Phase auf
      // einem anderen Gerät entstanden sind, sofort übernommen.
      const {data,error}=await client.from('einsaetze')
        .select('id,einsatz_code,status,zustand')
        .eq('id',state.einsatz.cloudId)
        .single();
      if(error) throw error;
      if(!data) return false;

      if(data.status==='beendet'){
        const remote=data.zustand;
        if(remote){
          remote.einsatz=remote.einsatz||{};
          remote.einsatz.cloudId=data.id;
          remote.einsatz.code=data.einsatz_code || remote.einsatz.code;
          saveHistory(remote);
        }
        state=null;
        await saveState(null);
        if(cloudChannel){ try{ await client.removeChannel(cloudChannel); }catch(e){} cloudChannel=null; }
        render();
        alert('Der Einsatz wurde während der Offline-Phase auf einem anderen Gerät beendet.');
        return true;
      }

      const remote=data.zustand;
      if(remote){
        remote.einsatz=remote.einsatz||{};
        remote.einsatz.cloudId=data.id;
        remote.einsatz.code=data.einsatz_code || remote.einsatz.code;
        applyingCloudState=true;
        try{
          state=remote;
          await saveState(state);
        }finally{
          applyingCloudState=false;
        }
        render();
      }

      // Realtime-Kanal nach einer Offline-Phase sicher neu aufbauen.
      await startRealtime(data.id);
      return true;
    }catch(e){
      console.warn('Cloud-Stand konnte nach Wiederverbindung noch nicht geladen werden:',e);
      return false;
    }
  }

  window.addEventListener('online', ()=>setTimeout(async()=>{
    if(state?.einsatz?.cloudId){
      await refreshCloudEinsatzOnReconnect();
    }else{
      await syncOfflineEinsatzIfPossible();
    }
  },500));

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Rückzugsdruck für den gesamten Trupp:
  // Am Einsatzziel wird nur der niedrigste Druck des Trupps erfasst.
  // Für den Rückweg werden 2x des bisherigen Verbrauchs benötigt.
  // Maßgeblich ist immer die ungünstigste (höchste) daraus resultierende Schwelle.
  function computeRueckzugSchwelle(t, niedrigsterZieldruck){
    const ziel = Number(niedrigsterZieldruck);
    if(!Number.isFinite(ziel)) return null;

    let schwelle = 0;
    t.mitglieder.forEach(m=>{
      const start = Number(m.startdruck);
      if(Number.isFinite(start)){
        const verbrauchHinweg = start - ziel;
        const benoetigteReserveRueckweg = verbrauchHinweg * 2;
        schwelle = Math.max(schwelle, Math.round(benoetigteReserveRueckweg));
      }
    });
    return Math.max(0, schwelle);
  }

  function checkSofort(t, werte){
    if(!t.rueckzugSchwelle || !werte || !werte.length) return;
    const druck = Number(werte[0].druck);
    if(!Number.isFinite(druck)) return;
    const schwelle = Number(t.rueckzugSchwelle);
    if(Number.isFinite(schwelle) && druck <= schwelle){
      t.rueckzugSofort = true;
      addLog(t, '⚠ WARNUNG: Niedrigster Truppdruck (' + druck + ' bar) erreicht/unterschritten — Rückzugsreserve ' + schwelle + ' bar. Rückzug sofort einleiten!');
      alarmTriple(); setTimeout(alarmTriple, 700);
    }
  }

  function applyScanToMember(tmp, i, raw){
    const parts = raw.split(/[;|]/).map(s=>s.trim());
    tmp.mitglieder[i].name = parts[0] || tmp.mitglieder[i].name;
    // QR-Codes im alten Format Name;Funkruf;Gerät werden weiterhin akzeptiert.
    // Der Funkruf gehört jetzt zum gesamten Trupp; das Gerätefeld wird ignoriert.
    if(parts[1]) tmp.funkruf = parts[1];
  }

  // ---------- Start-Logik ----------
  // Start ist ausschließlich möglich, wenn für jedes Mitglied ein Startdruck vorliegt.
  function attemptStart(id){
    const t = state.trupps.find(x=>x.id===id); if(!t) return;
    const namesSet = t.mitglieder.length>0 && t.mitglieder.every(m => String(m.name||'').trim()!=='');
    if(!namesSet){
      alert('Der Trupp kann erst gestartet werden, wenn für alle Mitglieder ein Name eingetragen ist.');
      return;
    }
    const allSet = t.mitglieder.every(m => m.startdruck!=null && m.startdruck!=='' && Number.isFinite(Number(m.startdruck)));
    // Wenn noch Drücke fehlen ODER noch kein Auftrag hinterlegt ist,
    // öffnen wir die Startmaske. So kann der Auftrag auch dann noch
    // erfasst werden, wenn die Startdrücke bereits vorher eingetragen wurden.
    if(!allSet || !String(t.auftrag||'').trim()) {
      openStartModal(id);
      return;
    }
    doStart(t, t.mitglieder.map(m=>({name:m.name, druck:m.startdruck})));
  }

  async function doStart(t, werte){
    t.status = 'aktiv';
    t.start = Date.now();
    t.lastDruckCheck = Date.now();
    t.druckReminderActive = false;
    t.druckReminderLastAlarmAt = 0;
    if(werte.length) t.druckwerte.push({zeit: Date.now(), werte, kontext:'start'});
    addLog(t, 'Luftversorgung angeschlossen — Startdruck erfasst, Überwachung gestartet');
    await saveState(state);
    render();
  }

  // ---------- Druck erfassen: normal / bei Ziel erreicht / bei Rückzug / Einsatzende ----------
  function openDruckModal(id, context, onDone){
    context = context || 'normal';
    const t = state.trupps.find(x=>x.id===id); if(!t) return;
    const last = lastDruckLine(t);
    const isEnde = context === 'ende';

    const titles = {
      normal: 'Druckabfrage',
      ziel: 'Einsatzziel erreicht — Druckabfrage',
      rueckzug: 'Rückzug begonnen — Druckabfrage',
      ende: 'Einsatzende — Abschlussdruck erfassen'
    };
    const okLabels = {
      normal: 'Niedrigsten Druck speichern',
      ziel: 'Ziel bestätigen & Druck speichern',
      rueckzug: 'Rückzug bestätigen & Druck speichern',
      ende: 'Druck speichern & Einsatz beenden'
    };

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>${esc(t.name)} — ${titles[context]}</h2>
        <p style="color:var(--text-dim); font-size:12px; margin-top:-8px;">
          ${isEnde
            ? 'Zum Einsatzende wird der Abschlussdruck von jedem Mitglied einzeln erfasst.'
            : 'Es wird nur der niedrigste Druck des gesamten Trupps benötigt.'}
        </p>
        <div id="druck-wrap2">
          ${isEnde ? t.mitglieder.map((m,i)=>{
            const prev = last ? (last.werte.find(w=>w.name===m.name)||{}).druck : null;
            return `<div class="field">
              <label>${esc(m.name)} — Abschlussdruck (bar)</label>
              <input type="number" step="1" min="0" max="400" class="cd-input" data-i="${i}" placeholder="${prev!=null?('zuletzt: '+prev):'bar'}">
            </div>`;
          }).join('') : `
            <div class="field">
              <label>Niedrigster Druck im Trupp (bar)</label>
              <input type="number" step="1" min="0" max="400" class="cd-input" id="trupp-druck-input" placeholder="${last && last.werte.length ? ('zuletzt: '+Math.min(...last.werte.map(w=>Number(w.druck)))) : 'bar'}">
            </div>`}
        </div>
        ${context === 'ziel' ? '<p style="color:var(--text-dim); font-size:12px;">Aus dem Verbrauch bis zum Einsatzziel wird die erforderliche Rückzugsreserve berechnet: Verbrauch auf dem Hinweg × 2. Maßgeblich ist die höchste daraus resultierende Schwelle.</p>' : ''}
        <div class="modal-actions">
          <button class="btn ghost" id="cd-cancel">Abbrechen</button>
          <button class="btn primary" id="cd-ok">${okLabels[context]}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    function applyContextEvent(werte){
      if(context === 'ziel'){
        t.zielzeit = Date.now();
        if(werte.length){
          const niedrigsterZieldruck = Number(werte[0].druck);
          t.rueckzugSchwelle = computeRueckzugSchwelle(t, niedrigsterZieldruck);
          addLog(t, 'Einsatzziel erreicht — niedrigster Truppdruck: ' + niedrigsterZieldruck + ' bar. Erforderlicher Rückzugsdruck: ' + t.rueckzugSchwelle + ' bar (2× Hinwegverbrauch, ungünstigster Wert).');
        }
      } else if(context === 'rueckzug'){
        t.rueckzugzeit = Date.now();
        addLog(t, 'Rückzug begonnen — niedrigster Truppdruck: ' + (werte[0]?.druck ?? 'n/a') + ' bar');
      } else if(context === 'ende'){
        t.endzeit = Date.now();
        t.status = 'beendet';
        addLog(t, 'Einsatzende — Abschlussdruck: ' + werte.map(w=>w.name+' '+w.druck+' bar').join(', '));
      } else {
        addLog(t, 'Druckabfrage — niedrigster Truppdruck: ' + (werte[0]?.druck ?? 'n/a') + ' bar');
      }
    }

    overlay.querySelector('#cd-cancel').onclick = ()=> overlay.remove();
    overlay.querySelector('#cd-ok').onclick = async ()=>{
      const werte = [];

      if(isEnde){
        let unvollstaendig = false;
        overlay.querySelectorAll('.cd-input').forEach(inp=>{
          const i = +inp.dataset.i;
          if(inp.value === '') unvollstaendig = true;
          else werte.push({name:t.mitglieder[i].name, druck:+inp.value});
        });
        if(unvollstaendig || werte.length !== t.mitglieder.length){
          alert('Bitte für jedes Mitglied den Abschlussdruck eingeben.');
          return;
        }
      } else {
        const inp = overlay.querySelector('#trupp-druck-input');
        if(!inp || inp.value === ''){
          alert('Bitte den niedrigsten Druck des Trupps eingeben.');
          return;
        }
        const druck = Number(inp.value);
        if(!Number.isFinite(druck) || druck < 0){
          alert('Bitte einen gültigen Druckwert eingeben.');
          return;
        }
        werte.push({name:'Trupp (niedrigster Druck)', druck});
      }

      // ASUE v1.1.2 - reale Druckprüfung
      const letzterDruck = lastDruckLine(t);
      let vorher = null;
      if(letzterDruck && letzterDruck.werte && letzterDruck.werte.length){
        vorher = Math.min(...letzterDruck.werte.map(w => Number(w.druck)));
      }

      const neuer = Math.min(...werte.map(w => Number(w.druck)));

      if(vorher !== null && neuer > vorher){
        const weiter = confirm(
          '⚠️ Ungewöhnlicher Druckwert\n\n' +
          'Letzter Druck: ' + vorher + ' bar\n' +
          'Neue Eingabe: ' + neuer + ' bar\n\n' +
          'Der neue Wert ist höher als der vorherige Wert.\nBitte prüfen.\n\nTrotzdem übernehmen?'
        );
        if(!weiter){
          return;
        }
      }

      t.druckwerte.push({zeit: Date.now(), werte, kontext: context});
      t.lastDruckCheck = Date.now();
      t.druckReminderActive = false;
      t.druckReminderLastAlarmAt = 0;
      applyContextEvent(werte);
      if(!isEnde) checkSofort(t, werte);
      await saveState(state);
      if(context === 'ende') saveHistory(state);
      overlay.remove(); render();
      if(context === 'ende' && typeof onDone === 'function') onDone();
    };
  }

  function openScanModal(onResult){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal" style="text-align:center;">
        <h2>QR-Code scannen</h2>
        <div class="scan-box"><video playsinline autoplay muted></video><div class="scan-hint">Code in den Rahmen halten</div></div>
        <canvas style="display:none;"></canvas>
        <input id="qr-camera-file" type="file" accept="image/*" capture="environment" style="display:none;">
        <div id="scan-camera-fallback" style="display:block;margin:10px 0 14px;">
          <button class="btn primary" id="scan-photo">📷 QR-Code per Foto erfassen</button>
        </div>
        <div class="field" style="text-align:left;"><label>Oder manuell eingeben (Name;Funkruf)</label><input id="manual-scan" placeholder="Mustermann;Angriffstrupp 1"></div>
        <div class="modal-actions">
          <button class="btn ghost" id="scan-cancel">Abbrechen</button>
          <button class="btn primary" id="scan-manual-ok">Übernehmen</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const video = overlay.querySelector('video');
    const canvas = overlay.querySelector('canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    let raf = null, stopped = false, localStream = null;
    let detector = null;
    try {
      if('BarcodeDetector' in window){
        const formats = ['qr_code'];
        detector = new BarcodeDetector({formats});
      }
    } catch(e) { detector = null; }

    const fileInput = overlay.querySelector('#qr-camera-file');
    const fallback = overlay.querySelector('#scan-camera-fallback');
    const hint = overlay.querySelector('.scan-hint');

    function showCameraFallback(message){
      hint.textContent = message || 'Live-Kamera nicht verfügbar. Du kannst alternativ den QR-Code per Foto erfassen.';
      fallback.style.display = 'block';
    }

    async function detectFrame(){
      if(stopped || video.readyState < video.HAVE_ENOUGH_DATA) return null;
      if(!window.jsQR) return null;

      const w = video.videoWidth, h = video.videoHeight;
      if(!w || !h) return null;

      // iPad/Safari: jsQR als Hauptscanner verwenden. BarcodeDetector kann
      // auf iOS je nach Version unzuverlässig sein und wird deshalb für die
      // Live-Kamera bewusst nicht vorgeschaltet.
      const side = Math.min(w, h);
      const crop = Math.min(side, 900);
      const sx = Math.max(0, Math.round((w - crop) / 2));
      const sy = Math.max(0, Math.round((h - crop) / 2));

      canvas.width = crop;
      canvas.height = crop;
      ctx.drawImage(video, sx, sy, crop, crop, 0, 0, crop, crop);
      let img = ctx.getImageData(0, 0, crop, crop);
      let code = jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
      if(code && code.data) return code.data;

      // Zweiter Versuch mit kleinerem Bild – auf älteren iPads deutlich
      // schneller und manchmal robuster bei ungünstiger Beleuchtung.
      const small = 600;
      const smallCanvas = document.createElement('canvas');
      smallCanvas.width = small;
      smallCanvas.height = small;
      const sctx = smallCanvas.getContext('2d', {willReadFrequently:true});
      sctx.drawImage(video, sx, sy, crop, crop, 0, 0, small, small);
      img = sctx.getImageData(0, 0, small, small);
      code = jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
      if(code && code.data) return code.data;

      return null;
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showCameraFallback('Live-Kamera ist hier nicht verfügbar.');
    }else{
      navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30}},
        audio:false
      }).then(async s=>{
        localStream = s;
        video.srcObject = s;
        try { await video.play(); } catch(e) {}
        tick();
      }).catch(err=>{
        console.warn('QR-Kamera konnte nicht gestartet werden:', err);
        showCameraFallback('Kamera konnte nicht gestartet werden. Bitte Kamerazugriff erlauben.');
      });
    }

    overlay.querySelector('#scan-photo').onclick = ()=> fileInput.click();
    fileInput.onchange = async ()=>{
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      hint.textContent = 'QR-Code wird erkannt …';
      try{
        const img = new Image();
        img.onload = async ()=>{
          try {
            // Auf iPad/Safari bewusst direkt jsQR verwenden.
            if(!window.jsQR){ URL.revokeObjectURL(img.src); hint.textContent='QR-Erkennung ist nicht geladen. Bitte App einmal mit Internet öffnen.'; return; }
            const max = 2200;
            const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
            const iw = Math.max(1, Math.round(img.naturalWidth * scale));
            const ih = Math.max(1, Math.round(img.naturalHeight * scale));
            canvas.width = iw; canvas.height = ih;
            ctx.drawImage(img,0,0,iw,ih);
            let data = ctx.getImageData(0,0,iw,ih);
            let code = jsQR(data.data,data.width,data.height,{inversionAttempts:'attemptBoth'});
            if(!code){
              const size=Math.min(iw,ih), sx=Math.max(0,Math.round((iw-size)/2)), sy=Math.max(0,Math.round((ih-size)/2));
              const c=document.createElement('canvas'); c.width=size; c.height=size;
              const cc=c.getContext('2d',{willReadFrequently:true}); cc.drawImage(img,sx/scale,sy/scale,size/scale,size/scale,0,0,size,size);
              data=cc.getImageData(0,0,size,size);
              code=jsQR(data.data,data.width,data.height,{inversionAttempts:'attemptBoth'});
            }
            URL.revokeObjectURL(img.src);
            if(code && code.data) finish(code.data);
            else hint.textContent = 'Kein QR-Code erkannt. Bitte den QR-Code groß, vollständig und scharf fotografieren.';
          } catch(e){
            console.error(e);
            hint.textContent = 'Foto konnte nicht verarbeitet werden.';
          }
        };
        img.onerror = ()=>{ URL.revokeObjectURL(img.src); hint.textContent = 'Foto konnte nicht gelesen werden.'; };
        img.src = URL.createObjectURL(file);
      }catch(e){
        console.error(e);
        hint.textContent = 'Foto konnte nicht verarbeitet werden.';
      }
    };

    let detecting = false;
    async function tick(){
      if(stopped || detecting) return;
      detecting = true;
      const result = await detectFrame();
      detecting = false;
      if(result){ finish(result); return; }
      raf = requestAnimationFrame(tick);
    }
    function cleanup(){
      stopped = true;
      if(raf) cancelAnimationFrame(raf);
      if(localStream){ localStream.getTracks().forEach(t=>t.stop()); }
      overlay.remove();
    }
    function finish(data){ cleanup(); onResult(String(data || '').trim()); }

    overlay.querySelector('#scan-cancel').onclick = cleanup;
    overlay.querySelector('#scan-manual-ok').onclick = ()=>{
      const v = overlay.querySelector('#manual-scan').value.trim();
      if(v) finish(v); else hint.textContent = 'Bitte QR-Code scannen oder Daten eingeben.';
    };
  }

  // ---------- Detaillierter PDF-Bericht, sortiert nach Trupps ----------
  async function exportPDF(einsatzState, options){
    einsatzState = einsatzState || state;
    options = options || {};
    if(!window.jspdf || !window.jspdf.jsPDF){
      if(!options.silent){
        alert('PDF-Bibliothek konnte nicht geladen werden. Bitte die App einmal mit Internet öffnen und erneut versuchen.');
      }
      console.warn('PDF-Bibliothek nicht verfügbar.');
      return false;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const pageBottom = 285;
    let y = 15;

    function ensureSpace(needed){
      if(y + needed > pageBottom){ doc.addPage(); y = 15; }
    }
    function line(text, x, size, bold){
      doc.setFontSize(size||10);
      doc.setFont(undefined, bold?'bold':'normal');
      doc.text(String(text), x, y);
    }

    line('Atemschutznachweis', 14, 17, true); y+=8;
    line(`Einsatzort: ${einsatzState.einsatz.ort}`, 14, 10, false); y+=5;
    line(`Datum: ${einsatzState.einsatz.datum}`, 14, 10, false); y+=5;
    line(`Atemschutzüberwachung: ${einsatzState.einsatz.leiter}`, 14, 10, false); y+=9;

    const sortedTrupps = [...einsatzState.trupps]
      .filter(t=>t.status!=='vorbereitet')
      .sort((a,b)=>a.name.localeCompare(b.name,'de'));

    if(sortedTrupps.length === 0){
      line('Noch keine Trupps mit Einsatzdaten vorhanden.', 14, 11, false);
    }

    sortedTrupps.forEach((t)=>{
      ensureSpace(14);
      doc.setDrawColor(180); doc.setLineWidth(0.3);
      doc.line(14, y-3, 196, y-3);
      line(t.name, 14, 13, true); y+=6.5;
      if(t.funkruf){ line(`Funkruf: ${t.funkruf}`, 16, 9.5, false); y+=4.6; }
      if(t.auftrag){ line(`Auftrag: ${t.auftrag}`, 16, 9.5, false); y+=4.6; }

      t.mitglieder.forEach(m=>{
        ensureSpace(5);
        line(`${m.name} — Startdruck: ${m.startdruck!=null?m.startdruck+' bar':'n/a'}`, 16, 9.5, false);
        y+=4.6;
      });
      y+=1.5;

      ensureSpace(20);
      line('Zeiten', 16, 10, true); y+=5;
      line(`Luft angeschlossen: ${t.start? new Date(t.start).toLocaleString('de-DE'):'-'}`, 18, 9.5, false); y+=4.4;
      if(t.zielzeit){ line(`Einsatzziel erreicht: ${new Date(t.zielzeit).toLocaleString('de-DE')}`, 18, 9.5, false); y+=4.4; }
      if(t.rueckzugzeit){ line(`Rückzug begonnen: ${new Date(t.rueckzugzeit).toLocaleString('de-DE')}`, 18, 9.5, false); y+=4.4; }
      if(t.endzeit){ line(`Einsatzende: ${new Date(t.endzeit).toLocaleString('de-DE')}`, 18, 9.5, false); y+=4.4; }
      const dauer = t.endzeit ? Math.round((t.endzeit-t.start)/60000) : (t.start ? Math.round((Date.now()-t.start)/60000) : 0);
      line(`Einsatzzeit gesamt: ${dauer} min (Soll: ${t.erwarteteZeitMin} min)`, 18, 9.5, false); y+=6;

      if(Number.isFinite(Number(t.rueckzugSchwelle))){
        ensureSpace(10);
        line('Benötigter Rückzugsdruck (Reserve für Rückweg)', 16, 10, true); y+=5;
        line(`Trupp (ungünstigster Wert): ${t.rueckzugSchwelle} bar`, 18, 9.5, false); y+=4.4;
        y+=2;
      }

      if(t.druckwerte && t.druckwerte.length){
        ensureSpace(10);
        line('Druckabfragen', 16, 10, true); y+=5.5;
        doc.setFontSize(9); doc.setFont(undefined,'bold');
        doc.text('Zeit', 18, y); doc.text('Mitglied', 46, y); doc.text('Druck', 88, y); doc.text('Anlass', 108, y); doc.text('Hinweis', 148, y);
        y+=1; doc.setDrawColor(210); doc.line(14, y, 196, y); y+=4;
        doc.setFont(undefined,'normal');
        const kontextLabel = {start:'Startdruck', normal:'Zwischenwert', ziel:'Einsatzziel', rueckzug:'Rückzug', ende:'Einsatzende', undefined:'Zwischenwert'};
        t.druckwerte.forEach(entry=>{
          entry.werte.forEach(w=>{
            ensureSpace(4.6);
            const schwelle = Number(t.rueckzugSchwelle);
            const warn = entry.kontext !== 'start' && entry.kontext !== 'ende' && Number.isFinite(schwelle) && w.druck <= schwelle ? 'RÜCKZUG SOFORT!' : '';
            doc.setFontSize(9);
            doc.text(new Date(entry.zeit).toLocaleTimeString('de-DE'), 18, y);
            doc.text(String(w.name), 46, y);
            doc.text(String(w.druck)+' bar', 88, y);
            doc.text(kontextLabel[entry.kontext]||'Zwischenwert', 108, y);
            if(warn){ doc.setTextColor(200,30,20); doc.text(warn, 148, y); doc.setTextColor(0,0,0); }
            y+=4.6;
          });
        });
        y+=3;
      }

      ensureSpace(8);
      line('Ereignisprotokoll', 16, 10, true); y+=5;
      doc.setFontSize(8.5); doc.setFont(undefined,'normal');
      (t.log || []).forEach(l=>{
        ensureSpace(4.2);
        const lines = doc.splitTextToSize(`${new Date(l.zeit).toLocaleTimeString('de-DE')} — ${l.text}`, 178);
        lines.forEach(ln=>{ ensureSpace(4.2); doc.text(ln, 18, y); y+=4.2; });
      });
      y+=6;
    });

    const filename = 'atemschutznachweis_'+einsatzState.einsatz.datum+'.pdf';
    const blob = doc.output('blob');

    // Sofortiger Download: funktioniert auf Android/Chrome und Safari/iPad
    // als normale lokale Datei (Downloads/Dateien – je nach System).
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
    }catch(e){
      console.warn('PDF-Download konnte nicht gestartet werden:', e);
    }

    // Zusätzlich als lokale Kopie in IndexedDB ablegen. Dadurch bleibt der
    // Detailbericht auch dann lokal erhalten, wenn der Browser den Download
    // nicht direkt in den Downloads-Ordner legt.
    try{
      if(einsatzState.einsatz && einsatzState.einsatz.id){
        await idbSet(PDF_HISTORY_KEY + einsatzState.einsatz.id, {
          filename,
          savedAt: Date.now(),
          blob
        });
      }
    }catch(e){
      console.warn('Lokale PDF-Kopie konnte nicht gespeichert werden:', e);
    }

    return true;
  }
  // ---------- Timer / Erinnerungs-Loop ----------
  const warned = {};
  const DRUCK_REPEAT_SEC = 30;   // solange die Druckabfrage offen ist, alle 30 s erneut erinnern
  const druckRepeatAt = {};
  const RUECKZUG_REPEAT_SEC = 15; // Rückzug-sofort-Alarm wiederholt sich, bis bestätigt
  const rueckzugRepeatAt = {};
  function tickWarnings(){
    if(!state) return;
    let changed = false;
    state.trupps.forEach(t=>{
      if(t.status !== 'aktiv') return;
      if(!warned[t.id]) warned[t.id] = {w1:false, w2:false};
      const elapsedSec = (Date.now() - t.start)/1000;
      const totalSec = t.erwarteteZeitMin*60;
      if(elapsedSec >= (1/3)*totalSec && !warned[t.id].w1){
        warned[t.id].w1 = true; addLog(t, '1/3 der Einsatzzeit erreicht — Druckkontrolle'); alarmDouble(); changed = true;
      }
      if(elapsedSec >= (2/3)*totalSec && !warned[t.id].w2){
        warned[t.id].w2 = true; addLog(t, '2/3 der Einsatzzeit erreicht — Rückzug prüfen'); alarmTriple(); changed = true;
      }
      // Druckabfrage alle 10 Minuten: 10, 20, 30 ... Minuten seit der
      // letzten tatsächlichen Druckabfrage. Bleibt die Abfrage offen, wird
      // bei jedem weiteren 10-Minuten-Punkt erneut akustisch erinnert.
      const minsSinceCheck = (Date.now() - (t.lastDruckCheck||t.start)) / 60000;
      const reminderIndex = Math.floor(minsSinceCheck / DRUCK_INTERVAL_MIN);
      if(reminderIndex >= 1){
        t.druckReminderActive = true;
        if(Number(t.druckReminderLastAlarmAt||0) < reminderIndex){
          t.druckReminderLastAlarmAt = reminderIndex;
          addLog(t, 'Erinnerung: Druckabfrage fällig (' + (reminderIndex * DRUCK_INTERVAL_MIN) + ' min seit letzter Abfrage)');
          alarmDruck();
          druckRepeatAt[t.id] = Date.now();
          changed = true;
        } else if(Date.now() - (druckRepeatAt[t.id]||0) >= DRUCK_REPEAT_SEC*1000){
          druckRepeatAt[t.id] = Date.now();
          alarmDruck();
        }
      }
      if(t.rueckzugSofort && Date.now() - (rueckzugRepeatAt[t.id]||0) >= RUECKZUG_REPEAT_SEC*1000){
        rueckzugRepeatAt[t.id] = Date.now();
        alarmTriple();
        try{ if(navigator.vibrate) navigator.vibrate([300,100,300,100,300]); }catch(e){}
      }
    });
    if(changed) saveState(state);
    if(document.getElementById('grid-active') || document.getElementById('grid-prep')){
      const logScrollPositions = captureLogScrollPositions();
      state.trupps.forEach(t=>{
        const card = document.getElementById('card-'+t.id);
        if(card) card.outerHTML = truppCard(t);
      });
      bindCard(state.trupps);
      restoreLogScrollPositions(logScrollPositions);
    }
  }
  // Display an lassen, solange mindestens ein Trupp aktiv ist (sonst können Alarme im Hintergrund ausbleiben)
  let wakeLock = null;
  async function keepScreenAwake(){
    try{
      if(!('wakeLock' in navigator)) return;
      const need = !!(state && state.trupps && state.trupps.some(t=>t.status==='aktiv'));
      if(need && !wakeLock && document.visibilityState==='visible'){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      } else if(!need && wakeLock){
        await wakeLock.release(); wakeLock = null;
      }
    }catch(e){ wakeLock = null; }
  }
  setInterval(keepScreenAwake, 5000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keepScreenAwake(); });
  setInterval(tickWarnings, 1000);
  setInterval(()=>syncOfflineEinsatzIfPossible(), 15000);
  setInterval(()=>touchParticipant(), 30000);
  window.addEventListener('online', ()=>{ touchParticipant(); refreshCloudStateIfAvailable(); });

  // Offline-first: lokaler Speicher bleibt aktiv; bei bestehender Verbindung
  // werden Cloud-Einsätze per Supabase Realtime zwischen den Geräten synchronisiert.

  (async function init(){
    try{ state = await loadState(); }catch(e){ state = null; }
    const client=cloudClient();
    if(!client){
      authReady=true;
      currentSession={user:{id:'local-'+uid()}};
      renderRolePicker('Offline-Modus: Einsatzdaten werden lokal gespeichert.');
      return;
    }
    client.auth.onAuthStateChange((event,session)=>{
      setTimeout(()=>handleAuthReady(session),0);
    });
    const {data}=await client.auth.getSession();
    if(data.session){
      await handleAuthReady(data.session);
    }else{
      const {data:anonData,error:anonError}=await client.auth.signInAnonymously({options:{data:{app:'Atemschutzüberwachung'}}});
      if(anonError){
        console.warn('Anonyme Anmeldung fehlgeschlagen:',anonError);
        currentSession={user:{id:'local-'+uid()}};
        authReady=true;
        renderRolePicker('Offline-Modus: Einsatzdaten werden lokal gespeichert.');
      }else{
        await handleAuthReady(anonData.session);
      }
    }
  })();

})();
</script>

<script>
function renderV111License(){
  const l = JSON.parse(localStorage.getItem("asue:lizenz") || "{}");

  const fw = l.feuerwehr || "-";
  const device = l.geraete_name || l.device_name || l.geraetename || "-";
  const deviceId = l.geraete_id || l.device_id || l.geraeteID || "-";
  const date = l.gueltig_bis || "-";

  const old = document.getElementById("ASUE_V111_VISIBLE_LICENSE");
  if(old) old.remove();

  const div=document.createElement("div");
  div.id="ASUE_V111_VISIBLE_LICENSE";
  div.className="asue-v111-license";
  div.innerHTML =
    "🔐 Lizenz<br>" +
    fw + "<br>" +
    "<b>" + code + "</b><br>" +
    (window.asueLicenseStatusText ? window.asueLicenseStatusText(l).replace("<br>", " · gültig bis " + date + "<br>") : "🟢 Aktiv · gültig bis " + date) + "<br>" +
    "Gerät: <b>" + device + "</b><br>" +
    "Geräte-ID: " + deviceId +
    '<div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
    '<button class="btn ghost small" id="asue-lic-check">Jetzt prüfen</button>' +
    '<button class="btn ghost small" id="asue-lic-change">Lizenz wechseln</button></div>';
  document.body.appendChild(div);
  const bCheck=div.querySelector("#asue-lic-check"), bChange=div.querySelector("#asue-lic-change");
  bCheck.onclick=async function(){
    if(!window.asueLicenseActions) return;
    bCheck.disabled=true; bCheck.textContent="Prüfe …";
    try{ await window.asueLicenseActions.check(); }catch(e){}
    bCheck.disabled=false; bCheck.textContent="Jetzt prüfen";
  };
  bChange.onclick=function(){ if(window.asueLicenseActions) window.asueLicenseActions.change(); };
}

window.addEventListener("load", renderV111License);
</script>
